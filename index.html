<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Linux Tools</title>
<style>
  :root {
    --bg-base:     #1e1e1e;
    --bg-surface:  #252525;
    --bg-overlay:  #2e2e2e;
    --bg-sidebar:  #131313;
    --border:      #343436;
    --text-primary:   #ffffff;
    --text-secondary: #98989e;
    --text-muted:     #68686e;
    --blue:   #0a84ff;
    --green:  #30d158;
    --yellow: #ffd60a;
    --red:    #ff453a;
    --purple: #bf5af2;
    --orange: #ff9f0a;
    --font-mono: 'SF Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(19,19,19,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--red);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .logo-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }
  .search-wrap {
    flex: 1;
    max-width: 420px;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }
  .search {
    width: 100%;
    background: var(--bg-overlay);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 13px;
    padding: 7px 10px 7px 30px;
    outline: none;
    transition: border-color .15s;
  }
  .search:focus { border-color: var(--blue); }
  .search::placeholder { color: var(--text-muted); }
  .count {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    white-space: nowrap;
  }
  .count b { color: var(--green); }

  /* ── Category pills ── */
  .cats-wrap {
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cats-wrap::-webkit-scrollbar { display: none; }
  .cats {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    white-space: nowrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-overlay);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    flex-shrink: 0;
  }
  .pill:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .pill.active { color: #fff; border-color: transparent; }
  .pill .n {
    font-family: var(--font-mono);
    font-size: 10px;
    opacity: .7;
  }

  /* ── Grid ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 20px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  /* ── Tool card ── */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, background .15s;
  }
  .card:hover { background: var(--bg-overlay); border-color: #4a4a4e; }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--text-primary);
    word-break: break-all;
  }
  .cat-badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .card-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 18px;
    flex: 1;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--blue);
    text-decoration: none;
    font-family: var(--font-mono);
    align-self: flex-start;
    opacity: .85;
  }
  .card-link:hover { opacity: 1; text-decoration: underline; }

  /* ── Empty state ── */
  .empty {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    grid-column: 1/-1;
  }
  .empty.show { display: block; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; }

  /* ── Category colors ── */
  .c-info      { background: rgba(10,132,255,.15); color: #4dabff; }
  .c-vuln      { background: rgba(255,214,10,.13); color: #ffd60a; }
  .c-web       { background: rgba(255,159,10,.15); color: #ff9f0a; }
  .c-db        { background: rgba(191,90,242,.15); color: #d08cff; }
  .c-pass      { background: rgba(255,69,58,.15);  color: #ff6b62; }
  .c-wifi      { background: rgba(48,209,88,.15);  color: #30d158; }
  .c-re        { background: rgba(255,159,10,.15); color: #ffb340; }
  .c-exploit   { background: rgba(255,69,58,.18);  color: #ff453a; }
  .c-sniff     { background: rgba(255,214,10,.13); color: #ffe566; }
  .c-post      { background: rgba(191,90,242,.18); color: #bf5af2; }
  .c-forensics { background: rgba(48,209,88,.13);  color: #4cd964; }
  .c-report    { background: rgba(152,152,158,.12);color: #98989e; }
  .c-social    { background: rgba(255,69,58,.13);  color: #ff9a94; }
  .c-crypto    { background: rgba(191,90,242,.13); color: #e0a0ff; }
  .c-hardware  { background: rgba(255,159,10,.18); color: #ffc55c; }
  .c-osint     { background: rgba(10,132,255,.18); color: #66b8ff; }
  .c-network   { background: rgba(48,209,88,.18);  color: #30d158; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .header-inner { flex-wrap: wrap; gap: 10px; }
    .search-wrap  { max-width: 100%; order: 3; flex-basis: 100%; }
    .count        { order: 2; }
    .grid { grid-template-columns: 1fr; }
    .main { padding: 14px 14px 40px; }
    .cats { padding: 8px 14px; }
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">⚔️</div>
      <div>

        <div class="logo-sub">reference</div>
      </div>
    </div>
    <div class="search-wrap">

      <div>Try a different search or category</div>

  </div>
</main>

  "Information Gathering":    { cls:"c-info",     icon:"🔍" },
  "Vulnerability Analysis":   { cls:"c-vuln",     icon:"🛡️" },
  "Web Application Analysis": { cls:"c-web",      icon:"🌐" },
  "Database Assessment":      { cls:"c-db",       icon:"🗄️" },
  "Password Attacks":         { cls:"c-pass",     icon:"🔑" },
  "Wireless Attacks":         { cls:"c-wifi",     icon:"📡" },
  "Reverse Engineering":      { cls:"c-re",       icon:"🔬" },
  "Exploitation Tools":       { cls:"c-exploit",  icon:"💥" },
  "Sniffing & Spoofing":      { cls:"c-sniff",    icon:"👁️" },
  "Post Exploitation":        { cls:"c-post",     icon:"🏴" },
  "Forensics":                { cls:"c-forensics",icon:"🧬" },
  "Reporting Tools":          { cls:"c-report",   icon:"📋" },
  "Social Engineering":       { cls:"c-social",   icon:"🎭" },
  "Crypto & Steganography":   { cls:"c-crypto",   icon:"🔐" },
  "Hardware Hacking":         { cls:"c-hardware", icon:"⚙️" },
}

// ── Deduplicate by name+cat ────────────────────────────────────────────────
const seen = new Set()
const tools = TOOLS.filter(t => {
  const k = t.name + '|' + t.cat
  if (seen.has(k)) return false
  seen.add(k); return true
})

// ── State ──────────────────────────────────────────────────────────────────
let activeCat = 'All'
let query = ''

// ── Build category list ────────────────────────────────────────────────────
const cats = ['All', ...Object.keys(CAT_META)]
const catsEl = document.getElementById('cats')
cats.forEach(c => {
  const cnt = c === 'All' ? tools.length : tools.filter(t => t.cat === c).length
  const btn = document.createElement('button')
  btn.className = 'pill' + (c === 'All' ? ' active' : '')
  btn.dataset.cat = c
  const m = CAT_META[c]
  btn.innerHTML = `${m ? m.icon + ' ' : ''}${c} <span class="n">${cnt}</span>`
  if (c !== 'All') btn.style.setProperty('--pill-active-bg', 'var(--bg-overlay)')
  btn.addEventListener('click', () => {
    activeCat = c
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'))
    btn.classList.add('active')
    render()
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' })
  })
  catsEl.appendChild(btn)
})

// color active pill based on category
function updatePillColors() {
  document.querySelectorAll('.pill').forEach(p => {
    const c = p.dataset.cat
    const m = CAT_META[c]
    p.classList.remove(...Object.values(CAT_META).map(x => x.cls))
    if (p.classList.contains('active') && m) p.classList.add(m.cls)
  })
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  updatePillColors()
  const q = query.toLowerCase()
  const filtered = tools.filter(t => {
    const catMatch = activeCat === 'All' || t.cat === activeCat
    const qMatch = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)
    return catMatch && qMatch
  })

  const grid = document.getElementById('grid')
  const empty = document.getElementById('empty')
  document.getElementById('cnt').textContent = filtered.length

  // remove old cards
  grid.querySelectorAll('.card').forEach(c => c.remove())

  if (!filtered.length) {
    empty.classList.add('show')
    return
  }
  empty.classList.remove('show')

  filtered.forEach(t => {
    const m = CAT_META[t.cat] || { cls:'c-info', icon:'🔧' }
    const card = document.createElement('div')
    card.className = 'card'
    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${t.name}</div>
        <span class="cat-badge ${m.cls}">${m.icon} ${t.cat}</span>
      </div>
      <div class="card-desc">${t.desc}</div>
      <a class="card-link" href="${t.url}" target="_blank" rel="noopener">↗ ${new URL(t.url).hostname}</a>
    `
    grid.appendChild(card)
  })
}

// ── Search ─────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  query = e.target.value
  render()
})

render()
</script>
