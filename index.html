<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Linux Tools</title>
<style>
  :root {
    --bg-base:        #1e1e1e;
    --bg-surface:     #252525;
    --bg-overlay:     #2e2e2e;
    --bg-sidebar:     #131313;
    --border:         #343436;
    --text-primary:   #ffffff;
    --text-secondary: #98989e;
    --text-muted:     #68686e;
    --text-disabled:  #58585e;
    --blue:   #0a84ff;
    --green:  #30d158;
    --yellow: #ffd60a;
    --red:    #ff453a;
    --purple: #bf5af2;
    --orange: #ff9f0a;
    --red-soft: #ff6961;
    --row-hover: rgba(255,255,255,.05);
    --font-mono: 'SF Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ── Tag (из NetScout) ── */
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 600; line-height: 1.4; letter-spacing: .01em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; white-space: nowrap;
    background: rgba(255,255,255,.08); color: var(--text-secondary);
  }
  .tag.blue   { background: rgba(10,132,255,.16);  color: #4da3ff; }
  .tag.green  { background: rgba(48,209,88,.16);   color: #4cd964; }
  .tag.red    { background: rgba(255,69,58,.16);   color: var(--red-soft); }
  .tag.yellow { background: rgba(255,214,10,.16);  color: #ffd426; }
  .tag.orange { background: rgba(255,159,10,.16);  color: #ffae33; }
  .tag.purple { background: rgba(191,90,242,.16);  color: #cf7bf5; }
  .tag.gray   { background: rgba(255,255,255,.08); color: var(--text-secondary); }

  /* ── Badge ── */
  .badge {
    font-size: 10px; font-weight: 600;
    background: rgba(255,255,255,.09); color: var(--text-secondary);
    padding: 1px 6px; border-radius: 7px;
  }

  /* ── Header ── */
  .titlebar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(19,19,19,.9);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 48px;
    display: flex; align-items: center; gap: 14px;
  }
  .app-name { font-size: 14px; font-weight: 700; letter-spacing: -.3px; flex-shrink: 0; }
  .search-wrap { flex: 1; max-width: 380px; }
  .search {
    width: 100%;
    background: var(--bg-overlay);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 12px;
    font-family: inherit;
    padding: 6px 11px;
    transition: border-color .12s, box-shadow .12s;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 0 2.5px rgba(10,132,255,.2); outline: none; }
  .search::placeholder { color: var(--text-muted); }
  .count-badge { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); flex-shrink: 0; }
  .count-badge b { color: var(--green); }

  /* ── Категории (tabs scrollable) ── */
  .cats-bar {
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cats-bar::-webkit-scrollbar { display: none; }
  .cats-inner {
    display: flex; gap: 4px;
    padding: 8px 20px;
    white-space: nowrap;
    max-width: 1200px; margin: 0 auto;
  }
  /* адаптируем .tabs/.tab из NetScout в скроллабельные пилюли */
  .cat-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 12px;
    border-radius: 7px; border: none;
    background: rgba(255,255,255,.06);
    color: var(--text-secondary);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; flex-shrink: 0;
    transition: background .12s, color .12s;
  }
  .cat-btn:hover { background: rgba(255,255,255,.1); color: var(--text-primary); }
  .cat-btn.active {
    color: var(--text-primary); font-weight: 600;
    background: rgba(255,255,255,.14);
    box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .cat-btn .badge { background: rgba(255,255,255,.08); color: var(--text-disabled); }
  .cat-btn.active .badge { background: rgba(255,255,255,.12); color: var(--text-secondary); }

  /* ── Сетка ── */
  .grid-wrap {
    max-width: 1200px; margin: 0 auto;
    padding: 16px 20px 48px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 8px;
  }

  /* ── Карточка инструмента (net-card стиль) ── */
  .tool-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .12s, background .12s;
  }
  .tool-card:hover { background: var(--bg-overlay); border-color: #4a4a4e; }
  .tool-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 13px 14px 8px;
  }
  .tool-name {
    font-family: var(--font-mono);
    font-size: 13px; font-weight: 600;
    color: var(--text-primary);
    word-break: break-all;
  }
  .tool-body {
    flex: 1;
    padding: 0 14px 10px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 19px;
  }
  .tool-foot {
    padding: 8px 14px 12px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .tool-link {
    font-size: 11px; font-family: var(--font-mono);
    color: var(--blue); text-decoration: none;
    opacity: .8;
  }
  .tool-link:hover { opacity: 1; text-decoration: underline; }

  /* ── Пусто ── */
  .empty-state {
    grid-column: 1/-1;
    display: none; text-align: center;
    padding: 64px 20px; color: var(--text-muted);
  }
  .empty-state.show { display: block; }
  .empty-state .empty-title { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }

  /* ── Мобилка ── */
  @media (max-width: 600px) {
    .titlebar { flex-wrap: wrap; height: auto; padding: 10px 14px; gap: 8px; }
    .search-wrap { order: 3; flex-basis: 100%; max-width: 100%; }
    .count-badge { order: 2; }
    .grid { grid-template-columns: 1fr; }
    .grid-wrap { padding: 12px 12px 48px; }
    .cats-inner { padding: 8px 12px; }
  }
  @media (min-width: 601px) and (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="titlebar">
  <span class="app-name">Kali Linux Tools</span>
  <div class="search-wrap">
    <input class="search" id="search" type="text" placeholder="Поиск..." autocomplete="off" spellcheck="false">
  </div>
  <span class="count-badge">показано <b id="cnt">0</b></span>
</header>

<div class="cats-bar">
  <div class="cats-inner" id="cats"></div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="empty-state" id="empty">
      <div class="empty-title">Ничего не найдено</div>
      <div>Попробуй другой запрос или категорию</div>
    </div>
  </div>
</div>

  "Database Assessment":      "purple",
  "Password Attacks":         "red",
  "Wireless Attacks":         "green",
  "Reverse Engineering":      "orange",
  "Exploitation Tools":       "red",
  "Sniffing & Spoofing":      "yellow",
  "Post Exploitation":        "purple",
  "Forensics":                "green",
  "Reporting Tools":          "gray",
  "Social Engineering":       "red",
  "Crypto & Steganography":   "purple",
  "Hardware Hacking":         "orange",
  "Bluetooth Tools":          "blue",
  "SDR":                      "purple",
  "VoIP Tools":               "yellow",
  "Fuzzing Tools":            "red",
  "Protection Tools":         "green",
}

// Дедупликация
const seen = new Set()
const tools = TOOLS.filter(t => {
  const k = t.name + '|' + t.cat
  if (seen.has(k)) return false
  seen.add(k); return true
})

let activeCat = 'All'
let query = ''

// ── Категории (кнопки) ────────────────────────────────────────────────────
const cats = ['All', ...Object.keys(CAT_COLOR)]
const catsEl = document.getElementById('cats')

cats.forEach(c => {
  const cnt = c === 'All' ? tools.length : tools.filter(t => t.cat === c).length
  const btn = document.createElement('button')
  btn.className = 'cat-btn' + (c === 'All' ? ' active' : '')
  btn.dataset.cat = c
  btn.innerHTML = `${c} <span class="badge">${cnt}</span>`
  btn.addEventListener('click', () => {
    activeCat = c
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' })
    render()
  })
  catsEl.appendChild(btn)
})

// ── Рендер ────────────────────────────────────────────────────────────────
function render() {
  const q = query.toLowerCase()
  const filtered = tools.filter(t => {
    const catOk = activeCat === 'All' || t.cat === activeCat
    const qOk = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)
    return catOk && qOk
  })

  const grid = document.getElementById('grid')
  const empty = document.getElementById('empty')
  document.getElementById('cnt').textContent = filtered.length
  grid.querySelectorAll('.tool-card').forEach(c => c.remove())

  if (!filtered.length) { empty.classList.add('show'); return }
  empty.classList.remove('show')

  filtered.forEach(t => {
    const color = CAT_COLOR[t.cat] || 'gray'
    let hostname = ''
    try { hostname = new URL(t.url).hostname } catch { hostname = t.url }

    const card = document.createElement('div')
    card.className = 'tool-card'
    card.innerHTML = `
      <div class="tool-head">
        <span class="tool-name">${t.name}</span>
        <span class="tag ${color}">${t.cat}</span>
      </div>
      <div class="tool-body">${t.desc}</div>
      <div class="tool-foot">
        <a class="tool-link" href="${t.url}" target="_blank" rel="noopener">${hostname}</a>
      </div>
    `
    grid.appendChild(card)
  })
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value
  render()
})

render()
</script>
</body>
</html>
